name: ci
on:
  push:
    branches:
      - main
      - master
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7
      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version: '1.26.6'
      - name: Install dependencies
        run: go mod download
      - name: Build
        run: go build -v ./...
      - name: Test with the Go CLI
        run: go test -v -race -shuffle=on -cover ./...

      - name: Verify generated mocks are up to date
        run: |
          go generate ./...
          git diff --exit-code -- rtorrent/rtorrent_moq.go
